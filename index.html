<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Trading - Technical Terminal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1f1f1f;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 2px solid #333;
    }
    .sub-header {
      background-color: #2c2c2c;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #00ffcc;
    }
    .control-panel {
      padding: 15px;
      text-align: center;
      background: #181818;
    }
    select {
      padding: 8px 12px;
      font-size: 16px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #1e1e1e;
    }
    th, td {
      border: 1px solid #333;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #252525;
      color: #ffcc00;
    }
    .buy { color: #00ff00; font-weight: bold; }
    .sell { color: #ff4d4d; font-weight: bold; }
    .strong-buy { color: #00ff00; font-weight: bold; background: rgba(0,255,0,0.1); }
    .strong-sell { color: #ff4d4d; font-weight: bold; background: rgba(255,77,77,0.1); }
    .neutral { color: #aaaaaa; }
  </style>
</head>
<body>

  <header>Pro Trading - Technical Terminal</header>
  
  <div class="sub-header" id="statusText">
    🟢 LIVE MARKET DATA ACTIVE | Updated: --:--:--
  </div>

  <div class="control-panel">
    <label for="assetSelect">Select Asset: </label>
    <select id="assetSelect" onchange="fetchData()">
      <option value="EUR/USD">EUR/USD</option>
      <option value="GBP/USD">GBP/USD</option>
      <option value="USD/JPY">USD/JPY</option>
      <option value="AUD/USD">AUD/USD</option>
      <option value="USD/CAD">USD/CAD</option>
      <option value="USD/CHF">USD/CHF</option>
      <option value="EUR/JPY">EUR/JPY</option>
      <option value="GBP/JPY">GBP/JPY</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Asset Name & Price</th>
        <th>Indicator Type</th>
        <th>1 Min</th>
        <th>5 Min</th>
        <th>15 Min</th>
        <th>30 Min</th>
      </tr>
    </thead>
    <tbody id="terminalBody">
      <tr>
        <td colspan="6">Loading live market feed...</td>
      </tr>
    </tbody>
  </table>

  <script>
    function getCssClass(val) {
      if (!val) return 'neutral';
      if (val === 'Strong Buy') return 'strong-buy';
      if (val === 'Strong Sell') return 'strong-sell';
      if (val === 'Buy') return 'buy';
      if (val === 'Sell') return 'sell';
      return 'neutral';
    }

    async function fetchData() {
      const symbol = document.getElementById('assetSelect').value;
      try {
        const response = await fetch(`/api/terminal?symbol=${encodeURIComponent(symbol)}`);
        const json = await response.json();

        if (json.success && json.data) {
          const item = json.data;
          const now = new Date().toLocaleTimeString();
          document.getElementById('statusText').innerText = `🟢 LIVE MARKET DATA ACTIVE | Updated: ${now}`;

          const tbody = document.getElementById('terminalBody');
          tbody.innerHTML = `
            <tr>
              <td rowspan="3" style="vertical-align: middle;">
                <strong style="font-size: 18px;">${item.name}</strong><br>
                <span style="color: ${item.color}; font-size: 16px; font-weight: bold;">${item.price}</span>
              </td>
              <td>Moving Averages:</td>
              <td class="${getCssClass(item.ma[0])}">${item.ma[0]}</td>
              <td class="${getCssClass(item.ma[1])}">${item.ma[1]}</td>
              <td class="${getCssClass(item.ma[2])}">${item.ma[2]}</td>
              <td class="${getCssClass(item.ma[3])}">${item.ma[3]}</td>
            </tr>
            <tr>
              <td>Technical Indicators:</td>
              <td class="${getCssClass(item.ti[0])}">${item.ti[0]}</td>
              <td class="${getCssClass(item.ti[1])}">${item.ti[1]}</td>
              <td class="${getCssClass(item.ti[2])}">${item.ti[2]}</td>
              <td class="${getCssClass(item.ti[3])}">${item.ti[3]}</td>
            </tr>
            <tr>
              <td>Overall Summary:</td>
              <td class="${getCssClass(item.s[0])}">${item.s[0]}</td>
              <td class="${getCssClass(item.s[1])}">${item.s[1]}</td>
              <td class="${getCssClass(item.s[2])}">${item.s[2]}</td>
              <td class="${getCssClass(item.s[3])}">${item.s[3]}</td>
            </tr>
          `;
        }
      } catch (err) {
        console.error("Error fetching data:", err);
      }
    }

    // প্রথম লোডেই ডেটা ফেচ করবে
    fetchData();

    // প্রতি ৩০ সেকেন্ড পর পর অটো রিকোয়েস্ট পাঠাবে (API Limit Safe)
    setInterval(fetchData, 30000);
  </script>

</body>
</html>
