<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investing Terminal - 100% Original</title>
<style>
body{background:#0b0e11;color:#fff;font-family:Arial;padding:10px}
table{width:100%;border-collapse:collapse;background:#151a21}
th,td{border:1px solid #222;padding:8px;text-align:center;font-size:12px}
th{background:#1e252f}
.green{color:#26a69a;font-weight:bold}
.red{color:#ef5350;font-weight:bold}
.blue{color:#888}
</style>
</head>
<body>
<h2>🔴 LIVE Investing.com Original</h2>
<table id="tbl"><thead><tr><th>Pair</th><th>Price</th><th>MA 5m</th><th>MA 15m</th><th>TI 5m</th><th>Summary 5m</th></tr></thead><tbody></tbody></table>
<script>
async function load(){
  const r = await fetch('/api/terminal'); const j = await r.json();
  if(!j.success){document.body.innerHTML=j.error; return;}
  let html='';
  j.data.forEach(d=>{
    html+=`<tr><td>${d.name}</td><td class="${d.color}">${d.price}</td><td class="${d.ma[0].toLowerCase().includes('buy')?'green':d.ma[0].toLowerCase().includes('sell')?'red':'blue'}">${d.ma[0]}</td><td>${d.ma[1]}</td><td>${d.ti[0]}</td><td>${d.s[0]}</td></tr>`;
  });
  document.querySelector('#tbl tbody').innerHTML=html;
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
