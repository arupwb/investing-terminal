<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pro Trading Terminal - Investing Technical Summary</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

.h{
  background:#1a1a1a;
  color:#fff;
  padding:12px;
  font-size:20px;
  font-weight:900;
}

.h b{
  color:orange;
}

.tabs{
  display:flex;
  gap:15px;
  padding:10px 12px;
  background:#f5f5f5;
  font-weight:700;
  border-bottom:1px solid #ddd;
}

.tabs span{
  border-bottom:2px solid #000;
  padding-bottom:5px;
}

#status{
  padding:8px;
  text-align:center;
  font-size:13px;
  font-weight:700;
  background:#fff3cd;
  color:#856404;
  border-bottom:1px solid #ddd;
}

.tableWrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:760px;
  border-collapse:collapse;
  font-size:13px;
}

th,
td{
  border:1px solid #ddd;
  padding:7px;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#f3f3f3;
  font-weight:900;
}

.name{
  color:#0b46da;
  font-weight:900;
  font-size:14px;
}

.price{
  margin-top:3px;
  font-weight:900;
  font-size:12px;
}

.red{
  color:#d50000;
}

.green{
  color:#008000;
}

.blue{
  color:#0b46da;
}

.type{
  text-align:left;
  font-weight:700;
}

.sb{
  color:#008000;
  font-weight:900;
}

.buy{
  color:#008000;
  font-weight:700;
}

.ss{
  color:#d50000;
  font-weight:900;
}

.sell{
  color:#d50000;
  font-weight:700;
}

.neutral{
  color:#777;
  font-weight:700;
}

.na{
  color:#888;
  font-weight:700;
}

.updated{
  font-size:11px;
  color:#666;
  padding:7px 10px;
  border-bottom:1px solid #ddd;
}

.source{
  font-size:10px;
  color:#888;
  padding:6px 10px;
}

@media(max-width:600px){

  .h{
    font-size:17px;
  }

  .tabs{
    font-size:12px;
  }

  table{
    min-width:720px;
    font-size:12px;
  }

  th,
  td{
    padding:6px;
  }
}
</style>
</head>

<body>

<div class="h">
  <b>P</b>ro Trading - Technical Terminal
</div>

<div class="tabs">
  <span>Forex &amp; Crypto Live Feed</span>
</div>

<div id="status">
  Connecting to Investing.com...
</div>

<div class="tableWrap">

<table>

<thead>
<tr>
  <th>Asset Name</th>
  <th>Indicator Type</th>
  <th>1 Min</th>
  <th>5 Min</th>
  <th>15 Min</th>
  <th>30 Min</th>
</tr>
</thead>

<tbody id="tbody">

<tr>
  <td colspan="6">
    Loading...
  </td>
</tr>

</tbody>

</table>

</div>

<div id="updated" class="updated">
  Waiting for first update...
</div>

<div class="source">
  Technical data source: Investing.com
</div>


<script>

const REFRESH_MS = 30000;

let busy = false;


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   SIGNAL CLASS
   ========================================================= */

function signalClass(value){

  const v =
    String(value || "")
      .trim()
      .toLowerCase();

  if(v === "strong buy")
    return "sb";

  if(v === "buy")
    return "buy";

  if(v === "neutral")
    return "neutral";

  if(v === "sell")
    return "sell";

  if(v === "strong sell")
    return "ss";

  return "na";
}


/* =========================================================
   SIGNAL RENDER
   ========================================================= */

function col(value){

  if(
    value === undefined ||
    value === null ||
    value === "" ||
    value === "N/A"
  ){

    return `<span class="na">N/A</span>`;

  }

  return `
    <span class="${signalClass(value)}">
      ${esc(value)}
    </span>
  `;
}


/* =========================================================
   PRICE CLASS
   ========================================================= */

function priceClass(color){

  if(color === "green")
    return "green";

  if(color === "red")
    return "red";

  return "blue";
}


/* =========================================================
   RENDER
   ========================================================= */

function render(data){

  const tbody =
    document.getElementById("tbody");

  if(!Array.isArray(data) || !data.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          No Investing.com data available
        </td>
      </tr>
    `;

    return;
  }


  let html = "";


  data.forEach(asset => {

    const ma =
      Array.isArray(asset.ma)
        ? asset.ma
        : ["N/A","N/A","N/A","N/A"];


    const ti =
      Array.isArray(asset.ti)
        ? asset.ti
        : ["N/A","N/A","N/A","N/A"];


    const summary =
      Array.isArray(asset.s)
        ? asset.s
        : ["N/A","N/A","N/A","N/A"];


    html += `

      <tr>

        <td rowspan="3">

          <div class="name">
            ${esc(asset.name)}
          </div>

          <div class="price ${priceClass(asset.color)}">
            ${esc(asset.price)}
          </div>

        </td>

        <td class="type">
          Moving Averages:
        </td>

        <td>${col(ma[0])}</td>
        <td>${col(ma[1])}</td>
        <td>${col(ma[2])}</td>
        <td>${col(ma[3])}</td>

      </tr>


      <tr>

        <td class="type">
          Technical Indicators:
        </td>

        <td>${col(ti[0])}</td>
        <td>${col(ti[1])}</td>
        <td>${col(ti[2])}</td>
        <td>${col(ti[3])}</td>

      </tr>


      <tr>

        <td class="type">
          <b>Overall Summary:</b>
        </td>

        <td><b>${col(summary[0])}</b></td>
        <td><b>${col(summary[1])}</b></td>
        <td><b>${col(summary[2])}</b></td>
        <td><b>${col(summary[3])}</b></td>

      </tr>

    `;

  });


  tbody.innerHTML = html;
}


/* =========================================================
   LOAD
   ========================================================= */

async function load(){

  if(busy)
    return;

  busy = true;

  const status =
    document.getElementById("status");


  try{

    status.style.background =
      "#fff3cd";

    status.style.color =
      "#856404";

    status.textContent =
      "Connecting to Investing.com...";


    const response =
      await fetch(
        "/api/terminal?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server HTTP " +
        response.status
      );

    }


    const json =
      await response.json();


    if(!json.success){

      throw new Error(
        json.error ||
        "Feed unavailable"
      );

    }


    render(json.data);


    status.style.background =
      "#d4edda";

    status.style.color =
      "#155724";

    status.textContent =
      "✅ INVESTING.COM TECHNICAL DATA ACTIVE";


    document.getElementById("updated")
      .textContent =
        "Last update: " +
        new Date().toLocaleTimeString();


  }catch(error){

    console.error(error);


    status.style.background =
      "#f8d7da";

    status.style.color =
      "#721c24";

    status.textContent =
      "⚠️ Feed Error: " +
      error.message;

  }finally{

    busy = false;

  }
}


/* =========================================================
   START
   ========================================================= */

load();

setInterval(
  load,
  REFRESH_MS
);

</script>

</body>
</html>
